spring.application.name=nfpl-access-control
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
springdoc.swagger-ui.path=/swagger-ui.html

# Local default: H2 database. For hosting, set SPRING_PROFILES_ACTIVE=prod and supply DATABASE_URL,
# DATABASE_USERNAME and DATABASE_PASSWORD as environment variables.
spring.datasource.url=jdbc:h2:file:./data/nfpldb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.thymeleaf.cache=false
